<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="음식대백과"><meta name="theme-color" content="#6d3fc0"><link rel="manifest" href="manifest.webmanifest?v=1"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=1"><title>요술방망이 음식대백과 V1</title><style>
:root{--p:#6d3fc0;--p2:#f0e8ff;--ink:#231b2e;--line:#e5dff0;--bg:#faf7ff;--green:#e6f6e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:var(--ink)}header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:10}.bar{max-width:1000px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:1.15rem}.ver{font-size:.78rem;background:var(--p2);padding:5px 9px;border-radius:999px;color:#53319a;font-weight:800}main{max-width:1000px;margin:auto;padding:16px 16px 70px}.hero{text-align:center;background:linear-gradient(145deg,#f0e8ff,#fff4dc);border:1px solid var(--line);border-radius:28px;padding:24px 14px}.hero .wand{font-size:4rem}.hero h1{margin:2px;font-size:1.9rem}.hero p{margin:7px;color:#665b70}.search{display:flex;gap:7px;max-width:620px;margin:16px auto 0}.search input{flex:1;border:2px solid #d5c7ec;border-radius:15px;padding:13px;font-size:1rem}.search button,.btn{border:0;border-radius:13px;padding:11px 14px;background:var(--p);color:#fff;font-weight:900}.homegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.homebtn{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 8px;text-align:center;font-weight:900;cursor:pointer}.homebtn span{display:block;font-size:2rem;margin-bottom:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}.panel h2{margin:0 0 12px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #d9cdec;background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.chip.on{background:var(--p);color:#fff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:13px}.card{border:1px solid var(--line);border-radius:17px;padding:13px;background:#fff;cursor:pointer}.card.saved{background:var(--green)}.emoji{font-size:2.7rem}.card h3{margin:5px 0}.tags{font-size:.75rem;color:#6e6279}.desc{color:#51475b;font-size:.9rem}.detail{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:30}.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:25px 25px 0 0;padding:20px}.sheetin{max-width:760px;margin:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:36px;height:36px;font-size:1.2rem}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fact{background:#f8f5fc;border-radius:12px;padding:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.alt{background:#fff!important;color:var(--p)!important;border:1px solid #cdbce9!important}.hidden{display:none}.notice{background:#fff8dd;border-radius:13px;padding:10px;margin-top:10px;font-size:.87rem}.empty{text-align:center;color:#756a7f;padding:28px}.addbox{display:flex;gap:8px}.addbox input{flex:1;padding:12px;border:1px solid #d9cdec;border-radius:12px}@media(max-width:700px){.homegrid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:410px){.cards{grid-template-columns:1fr}.hero h1{font-size:1.55rem}}
</style></head><body><header><div class="bar"><div class="brand">🪄 요술방망이 음식대백과</div><div class="ver">FOOD V1.0</div></div></header><main><section class="hero"><div class="wand">🪄🍲</div><h1>세계의 맛을 찾아 떠나요!</h1><p>나라로도 찾고, 음식 종류로도 찾는 나만의 음식대백과</p><div class="search"><input id="q" placeholder="음식 이름을 써보세요"><button onclick="searchFood()">찾기</button></div></section><div class="homegrid"><div class="homebtn" onclick="mode('country')"><span>🌏</span>나라별</div><div class="homebtn" onclick="mode('type')"><span>🍽️</span>종류별</div><div class="homebtn" onclick="mode('discover')"><span>🪄</span>새 음식 발견</div><div class="homebtn" onclick="mode('mine')"><span>⭐</span>내 음식카드</div></div><section class="panel" id="panel"><h2 id="pt">나라별 음식</h2><div class="chips" id="chips"></div><div class="cards" id="cards"></div></section></main><div id="detail" class="detail hidden" onclick="if(event.target===this)closeDetail()"><div class="sheet"><div class="sheetin"><button class="close" onclick="closeDetail()">×</button><div id="detailBody"></div></div></div></div><script>
const DBKEY='magic_food_encyclopedia_v1_cards';
const foods=[
{id:'tteokbokki',n:'떡볶이',e:'🌶️',country:'한국',type:['분식','떡요리'],ing:'떡, 고추장, 어묵',taste:'매콤하고 달콤해요',how:'떡과 양념을 함께 끓여 만들어요.',story:'한국의 대표적인 길거리 음식으로, 오늘날에는 치즈·크림 등 여러 모습으로 발전했어요.',d:'쫄깃한 떡을 매콤달콤한 양념에 끓여 먹는 한국의 대표 분식이에요.'},
{id:'bulgogi',n:'불고기',e:'🥩',country:'한국',type:['고기요리'],ing:'쇠고기, 간장, 파, 마늘',taste:'달콤하고 짭짤해요',how:'얇은 고기를 양념한 뒤 구워요.',story:'불에 구워 먹는 고기 문화에서 이름이 생겼어요.',d:'얇게 썬 고기를 간장 양념에 재워 구워 먹는 한국 음식이에요.'},

{id:'ramen',n:'라멘',e:'🍜',country:'일본',type:['면요리','국물요리'],ing:'면, 육수, 고기·달걀 등',taste:'육수에 따라 맛이 아주 다양해요',how:'육수에 면을 넣고 여러 고명을 올려요.',story:'지역마다 삿포로 미소라멘, 하카타 돈코츠라멘처럼 특징이 달라요.',d:'따뜻한 육수와 면, 여러 고명을 함께 즐기는 일본의 대표 면요리예요.'},
{id:'mapo',n:'마파두부',e:'🥘',country:'중국',type:['두부요리','고기요리'],ing:'두부, 다진 고기, 두반장, 향신료',taste:'맵고 얼얼하며 감칠맛이 나요',how:'양념과 고기를 볶고 두부를 넣어 끓여요.',story:'중국 쓰촨 지역과 깊은 관련이 있는 음식이에요.',d:'부드러운 두부에 매콤하고 향긋한 양념을 더한 중국 쓰촨 계열 음식이에요.'},

{id:'pizza',n:'피자',e:'🍕',country:'이탈리아',type:['빵요리','치즈요리'],ing:'밀가루 반죽, 토마토, 치즈',taste:'고소하고 짭짤해요',how:'반죽 위에 재료를 올려 높은 열로 구워요.',story:'나폴리식 피자는 세계적으로 널리 알려진 피자 전통 가운데 하나예요.',d:'납작한 반죽 위에 토마토와 치즈 등 재료를 올려 구운 이탈리아 음식이에요.'},
{id:'pasta',n:'파스타',e:'🍝',country:'이탈리아',type:['면요리'],ing:'밀가루 파스타, 소스',taste:'소스에 따라 맛이 크게 달라요',how:'파스타를 삶아 소스와 어울려 완성해요.',story:'스파게티, 펜네, 라비올리처럼 모양과 조리법이 매우 다양해요.',d:'다양한 모양의 면과 소스를 조합해 만드는 이탈리아의 대표 음식군이에요.'},
{id:'ratatouille',n:'라따뚜이',e:'🍆',country:'프랑스',type:['채소요리'],ing:'가지, 주키니, 토마토, 피망 등',taste:'채소의 부드럽고 깊은 맛이 나요',how:'여러 채소를 올리브유와 함께 익혀요.',story:'프랑스 남부 프로방스, 특히 니스 지역과 관련된 채소 요리로 알려져 있어요.',d:'여러 여름 채소를 부드럽게 익혀 맛을 어우러지게 하는 프랑스 남부 음식이에요.'},
{id:'bouillabaisse',n:'부야베스',e:'🐟',country:'프랑스',type:['해산물','국물요리'],ing:'여러 생선과 해산물, 토마토, 향신채',taste:'바다 향과 진한 국물 맛이 나요',how:'생선과 해산물을 향신채와 함께 끓여요.',story:'프랑스 마르세유를 대표하는 해산물 요리로 유명해요.',d:'여러 생선과 해산물을 향긋한 국물에 끓이는 프랑스 남부의 음식이에요.'},
{id:'paella',n:'빠에야',e:'🥘',country:'스페인',type:['밥요리','해산물'],ing:'쌀, 사프란, 채소, 고기 또는 해산물',taste:'재료의 풍미가 밥에 진하게 배어요',how:'넓은 팬에서 쌀과 재료를 함께 익혀요.',story:'스페인 발렌시아 지역에서 발전한 음식으로 알려져 있어요.',d:'넓은 팬에서 쌀과 여러 재료를 함께 익히는 스페인의 대표적인 쌀요리예요.'},
{id:'tomyum',n:'똠얌꿍',e:'🦐',country:'태국',type:['해산물','국물요리'],ing:'새우, 레몬그라스, 라임, 고추 등',taste:'시고 맵고 향긋해요',how:'향신 재료를 우린 국물에 새우 등을 넣어 끓여요.',story:'신맛·매운맛·향긋함의 조화가 특징적인 태국 음식이에요.',d:'새우와 향신 재료를 넣어 시고 매콤하게 끓이는 태국의 대표 국물요리예요.'},
{id:'pho',n:'퍼(포)',e:'🍜',country:'베트남',type:['면요리','국물요리'],ing:'쌀국수, 육수, 고기, 향채',taste:'맑고 향긋한 국물 맛이 나요',how:'쌀국수에 뜨거운 육수를 붓고 고기와 향채를 곁들여요.',story:'베트남을 대표하는 국수 음식 가운데 하나예요.',d:'쌀로 만든 면에 향긋한 육수와 고기를 곁들이는 베트남 국수예요.'},
{id:'biryani',n:'비리야니',e:'🍚',country:'인도',type:['밥요리','고기요리'],ing:'쌀, 향신료, 고기 또는 채소',taste:'향신료 향이 풍부해요',how:'향신료로 맛을 낸 재료와 쌀을 층층이 익히기도 해요.',story:'남아시아 여러 지역에서 다양한 방식으로 만들어져요.',d:'향긋한 쌀과 향신료, 고기나 채소를 어우러지게 만드는 남아시아의 쌀요리예요.'},
{id:'hamburger',n:'햄버거',e:'🍔',country:'미국',type:['고기요리','빵요리'],ing:'번, 고기 패티, 채소, 소스',taste:'고소하고 풍성해요',how:'구운 패티와 여러 재료를 빵 사이에 넣어요.',story:'미국의 대중적인 음식 문화를 상징하는 음식 가운데 하나가 되었어요.',d:'둥근 빵 사이에 패티와 채소 등을 넣어 먹는 대표적인 대중 음식이에요.'}
];
let current='country',filter='전체';function saved(){try{return JSON.parse(localStorage.getItem(DBKEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(DBKEY,JSON.stringify(a))}function mode(m){current=m;filter='전체';render()}function render(){let pt=document.getElementById('pt'),ch=document.getElementById('chips');ch.innerHTML='';if(current==='discover'){pt.textContent='🪄 새로운 음식 발견';ch.innerHTML='<div class="addbox"><input id="newfood" placeholder="예: 크로크무슈, 상하이 게요리"><button class="btn" onclick="discover()">설명 만들기</button></div><div class="notice">음식 전용 모드: 음식 이름·나라·종류를 기준으로 후보를 만들고, 확인한 뒤 하나의 원본 카드로 저장합니다.</div>';document.getElementById('cards').innerHTML='';return}let vals=[];if(current==='country'){pt.textContent='🌏 나라별 음식';vals=['전체',...new Set(foods.map(x=>x.country))]}else if(current==='type'){pt.textContent='🍽️ 음식 종류별';vals=['전체',...new Set(foods.flatMap(x=>x.type))]}else{pt.textContent='⭐ 내 음식카드'}if(current!=='mine')vals.forEach(v=>ch.innerHTML+=`<button class="chip ${filter===v?'on':''}" onclick="filter='${v}';render()">${v}</button>`);drawCards()}
function drawCards(list){let a=list||foods;if(current==='country'&&filter!=='전체')a=a.filter(x=>x.country===filter);if(current==='type'&&filter!=='전체')a=a.filter(x=>x.type.includes(filter));if(current==='mine')a=foods.filter(x=>saved().includes(x.id));let s=saved(),el=document.getElementById('cards');el.innerHTML=a.length?a.map(x=>`<article class="card ${s.includes(x.id)?'saved':''}" onclick="openFood('${x.id}')"><div class="emoji">${x.e}</div><h3>${x.n}</h3><div class="tags">${x.country} · ${x.type.join(' · ')}</div><p class="desc">${x.d}</p></article>`).join(''):'<div class="empty">아직 카드가 없어요.</div>'}
function openFood(id){let x=foods.find(v=>v.id===id);if(!x)return;let s=saved(),on=s.includes(id);document.getElementById('detailBody').innerHTML=`<div class="emoji">${x.e}</div><h1>${x.n}</h1><p>${x.d}</p><div class="facts"><div class="fact"><b>🌏 나라/지역</b><br>${x.country}</div><div class="fact"><b>🍽️ 분류</b><br>${x.type.join(', ')}</div><div class="fact"><b>🥕 주요 재료</b><br>${x.ing}</div><div class="fact"><b>😋 맛과 특징</b><br>${x.taste}</div></div><h3>어떻게 만들까요?</h3><p>${x.how}</p><h3>재미있는 음식 이야기</h3><p>${x.story}</p><div class="actions"><button class="btn" onclick="toggle('${id}')">${on?'카드에서 빼기':'⭐ 내 카드 만들기'}</button><button class="btn alt" onclick="alternate('${id}')">🔎 다른 설명/사진 찾아보기</button></div>`;document.getElementById('detail').classList.remove('hidden')}
function closeDetail(){document.getElementById('detail').classList.add('hidden');render()}function toggle(id){let a=saved();a=a.includes(id)?a.filter(v=>v!==id):[...a,id];save(a);openFood(id)}function alternate(id){let x=foods.find(v=>v.id===id);alert(`${x.n} 음식 전용 재검색 모드\n\nV1 기본판에서는 안전한 기본 설명을 보존합니다. 다음 검색 확장판에서는 음식 문맥 + 나라/지역 + 외국어 이름으로 1·2차 검색하여 다른 설명과 사진 후보를 보여주도록 연결합니다.`)}
function searchFood(){let q=document.getElementById('q').value.trim().toLowerCase();if(!q)return;let a=foods.filter(x=>(x.n+' '+x.country+' '+x.type.join(' ')+' '+x.d).toLowerCase().includes(q));current='search';document.getElementById('pt').textContent=`🔎 “${q}” 검색 결과`;document.getElementById('chips').innerHTML='';drawCards(a)}function discover(){let n=document.getElementById('newfood').value.trim();if(!n)return;let hit=foods.find(x=>x.n.includes(n)||n.includes(x.n));if(hit){openFood(hit.id);return}document.getElementById('cards').innerHTML=`<article class="card"><div class="emoji">🪄🍽️</div><h3>${n}</h3><div class="tags">새 음식 후보</div><p class="desc">음식 이름을 확인했습니다. 음식 전용 검색 확장판에서는 나라·지역, 원어 이름, 음식 종류를 먼저 판별한 뒤 설명과 사진 후보를 만듭니다.</p></article>`}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=1').catch(()=>{});
</script></body></html>
