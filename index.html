function openCountry(c){home.classList.add('hidden');listing.classList.remove('hidden');listTitle.textContent=`${COUNTRIES[c].flag} ${c} 음식`;listIntro.textContent=`${c}의 자연환경과 식재료, 조리법, 지역 전통을 대표 음식과 함께 정리했습니다.`;renderFoods(FOODS.filter(x=>x.country===c))}function renderFoods(a){foods.innerHTML=a.map((x,i)=>`<div class="food ${made.has(x.name)?'cardmade':''}" onclick='openFood(${JSON.stringify(x.name)})'><div class="ph">${x.flag} 🍴</div><div class="txt"><h3>${x.name}</h3><div class="tags"><span class="tag">${x.country}</span><span class="tag">${x.type}</span></div><p>${x.method.slice(0,78)}${x.method.length>78?'…':''}</p></div></div>`).join('')||'<p>검색 결과가 없습니다.</p>'}function goHome(){listing.classList.add('hidden');home.classList.remove('hidden')}function searchFood(){let v=q.value.trim().toLowerCase();if(!v)return;let a=FOODS.filter(x=>Object.values(x).join(' ').toLowerCase().includes(v));home.classList.add('hidden');listing.classList.remove('hidden');listTitle.textContent=`“${q.value.trim()}” 검색 결과`;listIntro.textContent=`${a.length}개의 음식 자료를 찾았습니다.`;renderFoods(a)}q.addEventListener('keydown',e=>{if(e.key==='Enter')searchFood()});
function openFood(n){let x=FOODS.find(f=>f.name===n);current=x;modal.classList.remove('hidden');cover.innerHTML=`<button class="close" onclick="closeM()">×</button><div class="big">${x.flag} 🍽️</div>`;body.innerHTML=`<h1>${x.name}</h1><div class="subtitle">${x.country} · ${x.region} · ${x.type}</div><div class="facts"><div class="fact"><b>나라·지역</b><br>${x.flag} ${x.country}</div><div class="fact"><b>음식 분류</b><br>${x.type}</div><div class="fact"><b>주요 재료</b><br>${x.ingredients}</div></div><div class="sec"><h2>개요</h2><p>${x.method}</p></div><div class="sec"><h2>지역과 음식문화</h2><p>${x.history}</p></div><div class="sec"><h2>재료와 조리의 특징</h2><p>${x.ingredients} 등을 중심으로 구성된다. 재료의 선택과 손질, 불의 세기, 양념과 곁들임은 지역과 가정에 따라 달라지며 같은 음식 안에서도 여러 전통이 존재한다.</p></div><div class="sec"><h2>백과 연결</h2><p>${x.country}의 다른 음식과 ${x.type} 분류의 세계 음식을 함께 비교하면 식재료와 조리법이 지역에 따라 어떻게 달라지는지 살펴볼 수 있다.</p></div><div class="actions"><button class="primary" onclick="makeCard()">⭐ 카드 만들기</button><button onclick="findPhoto()">📷 실제 사진 찾기</button><button onclick="otherDesc()">🔎 다른 설명·자료 찾기</button></div><p class="note">사진·추가 자료 찾기는 온라인 공개 백과 자료를 새 창에서 확인합니다. 확인한 뒤 이 백과의 카드 자료와 비교할 수 있습니다.</p>`}
function closeM(){modal.classList.add('hidden')}function makeCard(){made.add(current.name);localStorage.setItem('magic_food_v2_cards',JSON.stringify([...made]));alert(`${current.name} 카드를 저장했습니다.`)}function findPhoto(){window.open('https://commons.wikimedia.org/w/index.php?search='+encodeURIComponent(current.name+' '+current.country+' food')+'&title=Special:MediaSearch&type=image','_blank')}function otherDesc(){window.open('https://ko.wikipedia.org/w/index.php?search='+encodeURIComponent(current.name+' 음식'),'_blank')}init();
