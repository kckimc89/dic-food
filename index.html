function renderCountries(){countries.innerHTML=Object.entries(COUNTRIES).filter(([k,v])=>(region==='전체'||v.region.includes(region))).map(([k,v])=>{let total=FOODS.filter(x=>x.country===k).length,n=approvedFoods().filter(x=>x.country===k).length;return `<div class="country" onclick="openCountry('${k}')"><div class="flag">${v.flag}</div><h3>${k}</h3><small>${v.region} · 후보 ${total}종 · 설명검수 ${n}종</small><p>모든 후보를 보존하며 사진 실물검수까지 끝난 카드부터 완성합니다.</p></div>`}).join('')}
function openCountry(c){home.classList.add('hidden');listing.classList.remove('hidden');listTitle.textContent=`${COUNTRIES[c].flag} ${c} 음식`;listIntro.textContent='후보 음식 전체를 보존합니다. 설명 검수를 통과한 항목은 읽을 수 있고, 사진은 실물검수 완료 전에는 절대 자동검색 결과를 표시하지 않습니다.';renderFoods(FOODS.filter(x=>x.country===c))}
function renderFoods(a){foods.innerHTML=a.map(x=>{let copy=pmPass(x),done=cardComplete(x);let st=done?'완성 PM PASS':copy?'설명 종합완료 · 사진 검수중':'자료 조사·집필중';return `<div class="food ${done?'cardmade':''}" ${copy?`onclick='openFood(${JSON.stringify(x.name)})'`:''}><div class="txt"><h3>${x.name} <span class="pmstamp">${st}</span></h3><div class="tags"><span class="tag">${x.country}</span><span class="tag">${x.type}</span></div></div></div>`}).join('')||'<p>등록된 음식 후보가 없습니다.</p>'}
function goHome(){listing.classList.add('hidden');home.classList.remove('hidden')}
function searchFood(){let v=q.value.trim().toLowerCase();if(!v)return;let a=FOODS.filter(x=>Object.values(x).join(' ').toLowerCase().includes(v));home.classList.add('hidden');listing.classList.remove('hidden');listTitle.textContent=`“${q.value.trim()}” 검색 결과`;listIntro.textContent=`세계 음식 후보 ${a.length}개 · 완성 전 음식도 제작상태를 표시합니다`;renderFoods(a)}q.addEventListener('keydown',e=>{if(e.key==='Enter')searchFood()});
function esc(t){return String(t||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
const FOOD_NOTES={
'삼계탕':['어린 닭 속에 찹쌀·인삼·대추·마늘을 채워 국물이 뽀얗게 우러날 때까지 끓이는 한국의 닭요리다. 부드러운 닭고기와 따뜻한 국물을 함께 먹는다.','어린 닭·찹쌀·인삼·대추·마늘을 한 냄비에 넣고 오래 끓여 재료의 맛이 국물에 배게 한다.','담백하고 깊은 닭 국물에 인삼과 마늘의 향이 은은하게 난다. 닭고기는 매우 부드럽고 찹쌀은 촉촉하고 걸쭉한 식감을 더한다. 한국에서 널리 알려진 보양 음식으로 특히 더운 계절에도 많이 찾는다.'],
'김치':['채소를 소금에 절인 뒤 고춧가루·마늘·생강·젓갈 등의 양념을 버무려 발효시키는 한국의 대표 음식이다.','배추나 무를 절이고 양념을 고루 묻힌 뒤 숙성시켜 산뜻한 발효 풍미를 만든다.','아삭한 채소 식감에 매콤함·짠맛·감칠맛·산미가 겹친다. 발효가 진행될수록 신맛과 향이 깊어진다. 한국 식탁에서 매우 자주 먹는 기본 반찬이다.'],
'비빔밥':['밥 위에 색과 식감이 다른 나물·고기·달걀 등을 가지런히 올리고 고추장이나 양념과 함께 비벼 먹는 음식이다.','따뜻한 밥에 각각 조리한 나물과 고명을 올린 뒤 먹기 직전에 양념과 섞는다.','고소한 밥, 향긋한 나물, 짭짤하고 매콤한 양념이 한입에 섞인다. 부드러움과 아삭함이 함께 느껴지며 한국에서 식사 한 그릇으로 널리 먹는다.'],
'불고기':['얇게 썬 쇠고기를 간장·설탕·마늘·참기름 등을 넣은 양념에 재운 뒤 구워 먹는 한국의 고기요리다.','얇은 쇠고기에 달고 짭짤한 양념을 배게 한 뒤 불판이나 팬에서 빠르게 익힌다.','달콤짭짤하고 고소한 향이 나며 고기가 얇아 부드럽게 씹힌다. 한국을 대표하는 고기요리로 식당과 가정에서 널리 즐긴다.'],
'스시':['식초로 간한 밥에 생선·해산물·달걀·채소 등을 조합하는 일본 음식이다. 한입 크기의 니기리, 김으로 마는 마키 등 모습이 다양하다.','식초·설탕·소금으로 간한 밥을 알맞게 쥐거나 말고, 신선한 재료를 위에 얹거나 속에 넣는다.','밥의 은은한 새콤함과 해산물의 감칠맛이 중심이며 재료에 따라 부드럽거나 쫄깃하다. 일본뿐 아니라 세계적으로 매우 널리 알려져 있다.'],
'라멘':['진한 국물에 밀면을 담고 차슈·달걀·파·김 등을 올리는 일본의 면요리다. 국물의 종류에 따라 모습과 맛이 크게 달라진다.','돼지뼈·닭·생선·채소 등으로 낸 국물에 간장·된장·소금 등의 간을 더하고 삶은 면과 고명을 담는다.','국물은 진하고 감칠맛이 강하며 면은 탄력 있고 매끄럽다. 일본에서 일상적으로 매우 인기 있는 음식이며 세계 여러 나라에서도 즐긴다.'],
'마파두부':['부드러운 두부를 다진 고기와 두반장·고추·화자오가 들어간 붉은 소스에 끓여 내는 중국 쓰촨 계열 음식이다.','다진 고기와 향신 양념을 볶아 소스를 만든 뒤 두부를 넣어 맛을 배게 하고 전분으로 농도를 잡는다.','매콤하고 짭짤하며 강한 감칠맛이 난다. 화자오의 상쾌한 향과 얼얼한 감각, 부드러운 두부의 대비가 특징이다. 밥과 함께 널리 먹는다.'],
'부야베스':['여러 종류의 생선과 해산물을 토마토·마늘·올리브유·허브와 함께 끓이는 프랑스 남부의 해산물 요리다.','생선과 향신 채소를 충분히 끓여 국물에 바다의 맛을 우려내고 여러 해산물을 함께 익힌다.','진한 해산물 감칠맛에 토마토의 산미와 허브·마늘 향이 어우러진다. 생선은 부드럽고 국물은 풍부하다. 프랑스 마르세유를 대표하는 음식으로 잘 알려져 있다.'],
'피자':['납작하게 편 밀가루 반죽 위에 토마토·치즈와 여러 재료를 올려 높은 온도에서 구워내는 음식이다.','발효한 반죽을 얇게 펴고 소스와 치즈, 토핑을 올린 뒤 뜨거운 오븐에서 빠르게 굽는다.','구운 반죽은 가장자리가 바삭하거나 쫄깃하고 치즈는 부드럽고 고소하다. 세계에서 가장 널리 알려진 음식 가운데 하나로 식사·간식·배달음식으로 매우 흔하다.'],
'인제라':['크고 납작한 원형의 발효빵으로, 표면에 작은 구멍이 촘촘하게 생기는 에티오피아의 대표 음식이다. 여러 스튜와 채소를 위에 올려 함께 먹는다.','테프 등의 곡물 반죽을 발효시킨 뒤 넓은 철판에 얇게 부어 한쪽 면을 익힌다.','폭신하고 촉촉하며 약간 새콤한 발효 향이 난다. 스펀지 같은 표면이 소스를 잘 머금는다. 에티오피아의 일상 식사에서 중심이 되는 매우 중요한 음식이다.']};
Object.assign(FOOD_NOTES,{
'갈비':['뼈에 붙은 쇠고기나 돼지고기를 큼직하게 손질해 굽거나 양념해 익히는 한국의 고기요리다. 특히 양념갈비는 윤기 나는 고기와 뼈가 함께 보여 한눈에 특징을 알아볼 수 있다.','소갈비 또는 돼지갈비를 칼집 내거나 얇게 펴고, 간장·마늘·파·참기름·당류 등을 섞은 양념을 배게 한 뒤 불에 구워낸다.','불에 닿은 가장자리는 진하게 구워져 고소하고, 속살은 육즙이 남아 부드럽고 쫄깃하다. 간장 양념은 달콤짭짤하며 마늘과 참기름의 향, 불향이 고기 맛을 또렷하게 만든다.'],
'잡채':['투명하고 윤기 나는 당면 사이에 시금치·당근·버섯·고기 등 여러 재료가 섞여 색감이 풍성한 한국 음식이다.','고구마 전분으로 만든 당면을 삶고, 채소와 고기는 각각 알맞게 익힌 뒤 간장·설탕·참기름 양념과 함께 버무린다.','당면은 매끈하면서 탄력 있게 씹히고, 채소의 아삭함과 고기의 부드러움이 번갈아 느껴진다. 간장의 달콤짭짤함과 참기름의 고소한 향이 중심을 잡는다.'],
'떡볶이':['길쭉한 쌀떡을 붉고 걸쭉한 고추장 양념에 졸여 만드는 한국의 대표적인 분식이다. 어묵과 삶은 달걀 등이 함께 담기기도 한다.','쌀떡과 어묵을 고추장·고춧가루·당류가 들어간 양념 국물에 넣고 끓여, 양념이 떡 표면에 진하게 달라붙도록 졸인다.','떡은 말랑하면서 쫀득하고 양념은 달콤함 뒤에 매운맛이 따라온다. 따뜻하고 진한 양념 맛 때문에 간식이나 가벼운 한 끼로 매우 친숙하게 먹는다.'],
'냉면':['차갑게 식힌 육수나 매콤한 양념에 가늘고 질긴 면을 담아 먹는 한국의 면요리다. 얇게 썬 고기·오이·배·달걀 등이 고명으로 올라간다.','메밀이나 전분이 들어간 면을 삶아 차갑게 헹군 뒤, 시원한 육수를 붓거나 매콤한 양념에 비빈다.','면은 매끄럽고 탄력이 강하며, 물냉면은 차갑고 담백한 육수 맛이, 비빔냉면은 새콤달콤하고 매운 양념 맛이 선명하다.'],
'김밥':['김 위에 밥을 얇게 펴고 여러 재료를 길게 놓아 단단히 말아낸 뒤 한입 크기로 써는 한국 음식이다. 잘린 단면에 재료의 색이 또렷하게 드러난다.','참기름과 소금으로 간한 밥에 달걀·단무지·시금치·당근·고기나 어묵 등을 넣고 김으로 말아 썬다.','부드러운 밥과 바삭하거나 아삭한 채소, 달걀과 고기의 식감이 한입에 겹친다. 김과 참기름의 고소한 향이 뚜렷하고 휴대하기 쉬워 간편한 식사로 자주 먹는다.'],
'우동':['굵고 매끈한 밀면을 따뜻한 국물이나 차가운 소스와 함께 먹는 일본 면요리다. 굵은 흰 면발 자체가 가장 눈에 띄는 특징이다.','밀가루 반죽을 치대 굵게 뽑은 면을 삶아 다시마·가쓰오부시 등을 바탕으로 한 국물에 담거나 소스에 찍어 먹는다.','면은 부드러우면서도 통통하고 탄력이 있으며, 맑은 국물은 감칠맛과 은은한 단맛이 난다. 일본에서 매우 일상적인 면요리다.'],
'소바':['메밀가루를 중심으로 만든 가늘고 갈색빛이 도는 면을 장국과 함께 먹는 일본 음식이다. 차갑게 담아 찍어 먹거나 따뜻한 국물에 넣기도 한다.','메밀 반죽을 얇게 밀어 가늘게 썬 면을 삶고 차갑게 헹구거나 따뜻한 장국에 담는다.','메밀 특유의 구수하고 은은한 향이 나며 면은 우동보다 가늘고 쉽게 끊기는 편이다. 차갑게 먹으면 산뜻하고 담백한 인상이 강하다.'],
'덴푸라':['새우·생선·채소 등에 아주 가벼운 튀김옷을 입혀 바삭하게 튀겨내는 일본 요리다. 재료의 모양과 색이 얇은 튀김옷 사이로 드러난다.','차가운 반죽을 재료에 얇게 묻혀 뜨거운 기름에서 짧게 튀겨, 속재료는 촉촉하게 남기고 겉만 가볍게 바삭하게 만든다.','튀김옷은 얇고 바삭하며 기름진 느낌이 비교적 가볍다. 새우는 탱글하고 채소는 단맛과 수분이 살아 있어 재료마다 다른 식감을 맛볼 수 있다.'],
'돈카쓰':['두툼한 돼지고기에 빵가루 옷을 입혀 노릇하게 튀긴 뒤 먹기 좋게 썰어 내는 일본식 커틀릿이다.','돼지고기에 밀가루·달걀·굵은 빵가루를 차례로 입혀 튀기고, 보통 채 썬 양배추와 진한 소스를 곁들인다.','겉은 거칠고 바삭하게 부서지고 속 고기는 촉촉하고 부드럽다. 달콤새콤하고 진한 돈카쓰 소스가 고기의 고소함과 잘 어울린다.'],
'오코노미야키':['양배추가 듬뿍 들어간 반죽을 철판에서 두툼하게 부친 뒤 진한 소스·마요네즈·가쓰오부시 등을 얹는 일본 요리다.','잘게 썬 양배추와 밀가루 반죽에 고기나 해산물 등을 섞거나 올려 양면을 굽고 소스와 토핑으로 마무리한다.','겉은 노릇하고 속은 촉촉하며 양배추가 부드럽게 씹힌다. 짭짤달콤한 소스, 고소한 마요네즈, 가쓰오부시의 훈연 향이 강하게 느껴진다.'],
'야키토리':['한입 크기로 자른 닭고기와 닭의 여러 부위를 꼬치에 꿰어 불에 굽는 일본 음식이다.','닭고기를 꼬치에 꿰어 숯불이나 그릴에서 구우며 소금으로 간하거나 간장·미림·설탕을 졸인 타레 소스를 발라 굽는다.','불에 구운 닭의 고소함과 숯불 향이 또렷하고, 타레를 바른 것은 달콤짭짤한 윤기가 난다. 부위에 따라 부드러움·쫄깃함·바삭함이 달라진다.'],
'스키야키':['얇게 썬 쇠고기와 두부·대파·버섯·채소 등을 달콤짭짤한 간장 양념에 자작하게 익혀 먹는 일본식 전골이다.','얕은 냄비에서 쇠고기와 채소를 익히며 간장·설탕·미림을 바탕으로 한 양념을 더한다. 익힌 재료를 날달걀에 찍어 먹는 방식도 널리 알려져 있다.','쇠고기는 부드럽고 양념은 단맛과 짠맛이 선명하다. 두부와 채소가 고기 육즙과 간장 양념을 머금어 촉촉하고 진한 맛을 낸다.'],
'샤부샤부':['종잇장처럼 얇게 썬 고기와 채소를 끓는 육수에 몇 번 흔들어 빠르게 익혀 먹는 일본식 냄비요리다.','얇은 쇠고기나 돼지고기를 뜨거운 육수에 잠깐 담가 익히고, 채소·두부·버섯도 함께 익혀 폰즈나 참깨 소스에 찍는다.','고기는 오래 끓이지 않아 부드럽고 담백하며, 폰즈는 산뜻하고 참깨 소스는 고소하다. 재료를 바로 익혀 먹어 각각의 식감이 또렷하다.'],
'오니기리':['밥을 삼각형이나 둥근 모양으로 단단히 쥐고 가운데에 속재료를 넣거나 김을 둘러 만드는 일본의 간편한 밥 음식이다.','따뜻한 밥을 손이나 틀로 모양 잡고 소금으로 간하며, 연어·매실절임·참치마요 같은 속을 넣고 김을 두르기도 한다.','밥은 부드럽고 담백하며 김을 두르면 바다 향과 바삭한 식감이 더해진다. 휴대가 쉬워 일본의 편의점과 도시락에서 매우 흔하게 볼 수 있다.']
});

Object.assign(FOOD_NOTES,{
'전':['채소·해산물·생선·고기 같은 재료를 얇게 손질해 달걀옷을 입히거나, 반죽에 재료를 섞어 팬에 노릇하게 지져내는 한국 음식이다. 호박전처럼 한 조각씩 부치는 전부터 파전처럼 넓게 부치는 전까지 모습이 다양하다.','호박·생선·고기·파·해산물 등 전의 이름이 되는 재료가 중심이다. 재료에 밀가루와 달걀을 얇게 입히거나 반죽과 섞은 뒤, 기름을 두른 팬에서 양면을 노릇하게 지진다.','갓 부친 전은 기름에 닿은 표면과 가장자리가 고소하고 살짝 바삭하며 안쪽은 촉촉하다. 호박은 달큰하고 생선은 부드러우며 해물파전은 오징어·새우의 쫄깃함처럼 주재료의 맛과 식감이 그대로 살아난다.'],
'설렁탕':['소의 뼈와 고기를 오랫동안 끓여 뽀얀 국물을 내고, 얇게 썬 쇠고기와 소면·파 등을 담아 먹는 한국의 탕이다.','사골과 여러 소뼈·고기를 물에 오래 끓여 지방과 단백질이 어우러진 뽀얀 육수를 만든다. 그릇에 밥이나 소면, 삶은 고기와 파를 담고 뜨거운 국물을 붓는다.','국물은 자극적인 양념 없이 담백하면서 고소하고 묵직하다. 부드러운 쇠고기와 매끈한 소면이 함께 넘어가며, 소금과 파로 간을 맞추면 고기 국물의 깊은 맛이 더 선명해진다.'],
'해물파전':['긴 쪽파를 넉넉히 깔고 오징어·새우·조개 같은 해산물을 얹어 넓고 노릇하게 부쳐내는 한국식 전이다.','쪽파와 해산물을 팬에 펼친 뒤 밀가루 반죽과 달걀을 더해 앞뒤로 지진다. 파가 충분히 익으면서 단맛이 나고 해산물은 질겨지지 않게 익히는 것이 핵심이다.','가장자리는 바삭하고 가운데는 촉촉하며, 익은 파의 달큰한 향과 해산물의 짭조름한 감칠맛이 함께 난다. 오징어와 새우의 쫄깃하고 탱글한 식감이 부드러운 반죽과 대비된다.'],
'사시미':['신선한 생선과 해산물을 익히지 않고 먹기 좋은 두께로 정교하게 썰어 내는 일본 음식이다. 밥과 함께 쥐는 스시와 달리 생선 자체의 맛과 식감이 중심이다.','참치·도미·방어·연어·오징어 등 재료의 결에 맞춰 칼로 썰고, 간장·와사비·무채 같은 곁들임과 함께 낸다. 불을 쓰지 않는 만큼 재료의 선도와 손질이 중요하다.','생선 종류에 따라 담백함·기름진 고소함·은은한 단맛이 달라진다. 참치는 부드럽고, 흰살생선은 탄력 있으며, 오징어는 쫀득한 식감처럼 재료 고유의 차이가 또렷하게 느껴진다.'],
'베이징 카오야':['통오리를 구워 유리처럼 윤기 나고 바삭한 껍질을 만드는 베이징의 대표 오리요리다. 얇게 저민 오리고기와 껍질을 밀전병에 싸 먹는 모습으로 유명하다.','오리의 껍질을 팽팽하게 말리고 당 성분을 발라 고온에서 구워 껍질을 바삭하게 만든다. 얇은 밀전병에 오리·대파·오이와 달콤짭짤한 소스를 함께 싸 먹는다.','껍질은 얇고 바삭하면서 고소하고, 속 오리고기는 촉촉하고 진한 육향이 난다. 파와 오이의 산뜻한 식감, 진한 소스가 기름진 오리 맛을 균형 있게 받쳐준다.'],
'마파두부':['부드러운 두부를 다진 고기와 두반장·고추·화자오가 들어간 붉은 소스에 끓여 내는 중국 쓰촨의 대표 음식이다. 붉은 기름 사이로 흰 두부가 큼직하게 보이는 모습이 특징적이다.','다진 고기를 볶아 두반장과 고추로 매운 소스를 만들고 두부를 넣어 부서지지 않게 끓인다. 마지막에 화자오와 전분을 더해 향과 농도를 살린다.','첫맛은 짭짤하고 매콤하며 뒤이어 화자오 특유의 향과 혀끝이 얼얼한 감각이 온다. 두부는 매우 부드럽고 다진 고기는 씹는 맛을 더해 뜨거운 밥과 특히 잘 어울린다.'],
'훠궈':['향신료를 넣고 끓이는 뜨거운 육수에 얇은 고기·해산물·두부·버섯·채소를 직접 익혀 먹는 중국식 냄비요리다. 붉은 매운 육수와 맑은 육수를 반씩 나눈 원앙냄비도 익숙한 모습이다.','마라 육수에는 고추·화자오와 여러 향신료를 넣어 끓이고, 식탁에서 원하는 재료를 조금씩 넣어 익힌다. 익힌 재료는 참깨장이나 마늘·기름을 섞은 소스 등에 찍어 먹는다.','마라 육수는 고추의 매운맛과 화자오의 강한 향·얼얼함이 선명하다. 얇은 고기는 부드럽고 버섯과 채소는 육수를 머금으며, 한 냄비에서 재료마다 다른 식감을 차례로 즐길 수 있다.'],
'딤섬':['작은 찜통과 접시에 한입 크기로 담아 내는 광둥권의 다양한 간식·소요리들을 가리킨다. 투명한 새우만두 하가우, 돼지고기 시우마이, 폭신한 차슈바오처럼 모양부터 서로 다르다.','밀가루나 전분 피에 새우·돼지고기·채소 등을 싸서 찌거나, 반죽을 발효해 소를 넣어 찌고, 일부는 굽거나 튀긴다. 차와 함께 여러 종류를 조금씩 주문해 나눠 먹는 방식이 널리 알려져 있다.','하가우는 얇고 쫀득한 피 안에서 새우가 탱글하게 씹히고, 시우마이는 촉촉한 고기소의 감칠맛이 진하다. 종류마다 부드러움·쫄깃함·바삭함이 달라 여러 접시를 골라 먹는 재미가 크다.'],
'샤오롱바오':['얇은 만두피 안에 다진 고기와 뜨거운 육즙을 가득 품은 중국 장난 지역의 찐만두다. 윗부분을 촘촘히 주름 잡아 작은 주머니처럼 만든 모습이 특징이다.','고기소에 식으면 굳는 육수를 섞어 얇은 피로 감싼 뒤 작은 찜통에서 쪄낸다. 열을 받으면 굳어 있던 육수가 녹아 만두 안에 뜨거운 국물이 생긴다.','피는 얇고 부드러우며 한입 베면 뜨거운 육즙이 먼저 퍼진다. 돼지고기의 진한 감칠맛에 생강 향이 어우러지고, 식초와 생강채를 곁들이면 산뜻함이 더해진다.'],
'동파육':['두툼한 삼겹살을 네모난 덩어리로 잘라 짙은 간장빛이 돌도록 천천히 익혀내는 항저우의 대표 돼지고기 요리다. 살코기와 지방층이 층층이 보이고 표면에 윤기가 흐르는 모습이 특징이다.','지방과 살코기가 적절히 붙은 삼겹살을 파·생강·간장·설탕·중국 술 등과 함께 약한 불에서 오랫동안 익혀 양념이 속까지 배고 지방이 부드러워지게 한다.','젓가락으로 쉽게 갈라질 만큼 살코기가 부드럽고 지방층은 말랑하고 매끈하다. 간장의 짭짤함과 설탕의 은근한 단맛, 파·생강과 술의 향이 고기의 진한 풍미를 감싸며 오래 익혀도 느끼함이 과하지 않게 느껴지는 것이 매력이다.'],
'궁바오지딩':['닭고기를 땅콩·마른고추와 함께 볶아 윤기 나는 갈색 소스로 코팅하는 중국 쓰촨 계열의 볶음요리다. 작게 썬 닭고기와 붉은 고추, 땅콩이 한눈에 보인다.','닭고기를 한입 크기로 썰어 밑간하고 센 불에 볶은 뒤 마른고추·화자오·파·땅콩과 새콤달콤짭짤한 소스를 빠르게 섞어낸다.','닭고기는 촉촉하고 땅콩은 바삭해 식감 대비가 크다. 단맛·신맛·짠맛 뒤에 고추의 매운맛과 화자오 향이 올라와 한입마다 맛이 선명하다.'],
'탕수육':['돼지고기에 튀김옷을 입혀 바삭하게 튀긴 뒤 새콤달콤한 소스와 함께 먹는 중국계 튀김요리로 한국에서도 매우 친숙하다.','돼지고기를 길쭉하게 썰어 전분 중심의 튀김옷을 입혀 두 번 튀기기도 하며, 식초·설탕·간장과 채소로 만든 걸쭉한 소스를 곁들인다.','갓 튀긴 고기는 겉이 바삭하고 속은 부드럽다. 소스는 단맛과 식초의 산미가 또렷하며, 부어 먹으면 촉촉해지고 찍어 먹으면 튀김의 바삭함이 오래 남는다.'],
'차오판':['밥알이 서로 달라붙지 않게 센 불에서 볶고 달걀·파·고기·새우·채소 등을 섞어 만드는 중국식 볶음밥이다.','식은 밥이나 수분이 적은 밥을 뜨거운 웍에서 기름과 함께 빠르게 볶고, 달걀과 잘게 썬 재료를 넣어 밥알마다 고르게 열과 간이 닿게 한다.','밥알은 고슬고슬하고 표면은 기름에 코팅돼 고소하다. 달걀의 부드러움, 파의 향, 고기나 새우의 감칠맛이 더해지고 센 불에서 볶은 은은한 불향이 매력이다.'],
'완탕':['얇고 부드러운 밀가루 피에 다진 돼지고기나 새우소를 조금 넣어 감싼 중국식 만두로, 맑은 국물에 넣어 먹는 모습이 널리 알려져 있다.','아주 얇은 피에 고기·새우소를 넣어 작게 접고, 끓는 물에 익힌 뒤 닭이나 돼지고기·해산물로 낸 맑은 육수에 담는다.','피가 얇아 매끄럽게 넘어가고 속은 촉촉하고 탱글하다. 맑은 국물의 담백한 감칠맛이 만두소의 고기나 새우 맛을 가리지 않아 가볍고 편안하게 먹기 좋다.'],
'차슈':['돼지고기를 달콤짭짤한 양념에 재운 뒤 겉면에 윤기와 구운 향이 나도록 굽는 광둥식 바비큐 돼지고기다. 붉은 갈색 표면과 잘린 단면의 육즙이 특징이다.','돼지고기 목살이나 어깨살 등을 간장·당류·발효 소스와 향신료에 재운 뒤 오븐이나 화덕에서 굽고, 굽는 동안 양념을 덧발라 윤기 나는 표면을 만든다.','겉은 살짝 끈적하고 달콤짭짤하며 구운 향이 진하다. 안쪽 고기는 촉촉하고 부드러우며 가장자리의 진하게 구워진 부분은 캐러멜처럼 농축된 맛이 난다.'],
'마라샹궈':['고기·해산물·두부·버섯·채소 등 원하는 재료를 골라 마라 양념과 함께 국물 없이 볶아내는 중국식 매운 볶음요리다.','선택한 재료를 미리 익힌 뒤 고추·화자오·두반장과 향신료가 들어간 기름에 센 불로 볶아 양념을 재료 표면에 진하게 입힌다.','고추의 직선적인 매운맛과 화자오의 향긋하고 얼얼한 감각이 강하다. 국물이 없어 양념이 재료에 진하게 붙으며, 연근의 아삭함·두부의 부드러움·고기의 쫄깃함처럼 식감이 풍성하다.']
});


Object.assign(FOOD_NOTES,{
'쩨':['콩·찹쌀·과일·젤리·타피오카 같은 재료를 달콤한 국물이나 코코넛밀크와 함께 담아 먹는 베트남의 디저트 가족이다. 한 가지 정해진 모습이 아니라, 알록달록한 재료를 층층이 담은 차가운 쩨부터 따뜻하고 걸쭉한 단팥죽 같은 쩨까지 종류가 매우 다양하다.','검은콩·녹두·찹쌀·고구마·타로·과일·타피오카 펄·젤리 등을 각각 부드럽게 익히고 설탕으로 단맛을 낸다. 코코넛밀크나 판단 향을 더하고, 더운 날에는 얼음을 넣어 차갑게 먹는 종류도 많다.','코코넛밀크의 부드럽고 고소한 단맛 사이로 콩의 포슬함, 타피오카의 쫀득함, 젤리의 탱글함, 과일의 산뜻함이 번갈아 나타난다. 한 숟가락 안에서 온도와 질감이 계속 달라져 디저트이면서도 먹는 재미가 큰 음식이다.'],
'동파육':['두툼한 껍질 붙은 삼겹살을 네모난 덩어리로 잘라 붉은 갈색의 윤기가 돌 때까지 천천히 익히는 항저우의 대표 돼지고기 요리다. 완성된 한 조각에서 껍질·지방·살코기의 층이 또렷이 보여 보기만 해도 오래 익힌 부드러움이 느껴진다.','지방과 살코기가 고르게 붙은 삼겹살을 파와 생강 위에 놓고 황주·간장·설탕 등의 양념을 더해 약한 불에서 수 시간 익힌다. 긴 조리 동안 양념은 속까지 스며들고 지방과 껍질의 콜라겐은 말랑하게 풀리면서도 고기 덩어리의 형태는 유지된다.','젓가락만 대도 살코기가 결대로 갈라질 만큼 부드럽고, 껍질과 지방층은 매끈하고 젤라틴처럼 말랑하다. 간장의 깊은 짠맛과 설탕의 둥근 단맛, 황주·파·생강의 향이 진한 돼지고기 풍미를 감싸며, 지방이 많은 부위인데도 오래 익혀 기름지기보다 촉촉하고 농후하게 느껴지는 것이 매력이다.']
,
'똠얌꿍':['통통한 새우와 버섯이 레몬그라스·갈랑갈·마크루트 라임잎 향이 우러난 뜨거운 국물에 담기는 태국의 새콤매콤한 새우 수프다. 맑은 남사이와 고추 페이스트·연유 등을 더해 주황빛이 도는 남콘이 있으며, 어느 쪽이든 첫 숟가락에서 향긋한 허브와 라임의 산뜻함이 또렷하다.','새우 머리와 껍질로 감칠맛 나는 육수를 내고 레몬그라스·갈랑갈·마크루트 라임잎을 우려 향을 입힌다. 버섯과 새우를 짧게 익힌 뒤 피시소스로 짠맛과 감칠맛을 맞추고, 불을 끈 뒤 라임즙과 고추를 더해 신선한 산미와 매운 향을 살린다.','라임의 선명한 신맛이 먼저 입맛을 깨우고 고추의 매운맛, 피시소스의 짭짤한 감칠맛이 뒤따른다. 레몬그라스와 라임잎의 시트러스 향, 갈랑갈의 알싸하고 나무 향 같은 향이 뜨거운 김과 함께 올라오며, 새우는 탱글하고 버섯은 국물을 머금어 촉촉하다. 강렬하지만 무겁지 않아 한 숟가락 뒤에 다시 국물을 찾게 되는 맛이다.']});
const PM_APPROVED=new Set(Object.keys(FOOD_NOTES));
// V8.2 공식 제작 데이터: 여러 출처를 비교·종합한 뒤 새로 집필한다.
// source URL은 조사 근거용이며 카드 문장을 복사해 쓰지 않는다.
const RESEARCH_EVIDENCE={
 '똠얌꿍':{sources:['Hot Thai Kitchen — Tom Yum Goong','Hot Thai Kitchen — Creamy Tom Yum Goong'],synthesis:'레몬그라스·갈랑갈·마크루트라임잎의 공통 향을 중심으로, 새우를 쓰는 대표형과 맑은 국물/크리미 국물 변형을 함께 확인해 종합 집필',copyReviewed:true},
 '동파육':{sources:['Hangzhou official — Dongpo Pork','Hangzhou Flavor chef demonstration','Hangzhou cuisine standards'],synthesis:'껍질 붙은 삼겹살, 파·생강, 황주·간장·당류, 장시간 저온 조리라는 공통점을 교차확인해 종합 집필',copyReviewed:true},
 '쩨':{sources:['Vietnam Tourism — Vietnamese treats','Vietnam Tourism — Vietnamese desserts'],synthesis:'단일 조리법이 아니라 달콤한 수프·푸딩·음료를 포괄하며 콩·곡물·과일·젤리·코코넛 등이 다양하게 쓰인다는 공통점을 반영',copyReviewed:true}
};
// 사진은 검색 결과 URL만으로 PASS시키지 않는다. 실제 이미지를 사람이 확인하고 사용권까지 확인한 뒤 아래 레지스트리에만 등록한다.
const VERIFIED_PHOTOS={};
function cardComplete(x){return pmPass(x)&&Array.isArray(VERIFIED_PHOTOS[x.name])&&VERIFIED_PHOTOS[x.name].length>0&&VERIFIED_PHOTOS[x.name].every(p=>p.visualChecked&&p.rightsChecked)}

function fallbackNotes(x){
 const ing=(x.ingredients||'').trim(), method=(x.method||'').trim();
 const generic=/지역에서 널리 쓰이는|식생활에서 알려진|지역적 특징|지역과 가정|자연환경|생활방식/.test(ing+' '+method);
 if(!generic && ing && method) return [`${x.name}의 형태와 핵심 재료가 잘 드러나는 대표 음식이다.`,method,`${ing}을 중심으로 맛과 식감이 만들어진다.`];
 return [`${x.name}은(는) ${x.country}에서 알려진 ${x.type} 음식이다. 이 카드는 음식의 모습과 핵심 특징을 중심으로 소개한다.`,`${x.name}의 주재료와 대표적인 조리 방식이 음식의 형태를 만든다.`,`${x.name}의 맛·향·식감은 대표적인 조리법과 핵심 재료에서 결정된다.`];
}
function notes(x){return FOOD_NOTES[x.name]||fallbackNotes(x)}
function pmPass(x){let a=FOOD_NOTES[x.name];return !!(a&&a.length===3&&a.every(v=>v&&v.length>55)&&!/확인 중|보강|대표적인 조리 방식|핵심 재료에서 결정|형태와 핵심 재료|알려진 대표요리|지역적 특징이 나타난다|많은 사람들에게 사랑/.test(a.join(' ')))}

function approvedFoods(){return FOODS.filter(pmPass)}
function openFood(n){let x=FOODS.find(f=>f.name===n);if(!x||!pmPass(x))return;current=x;modal.classList.remove('hidden');let a=notes(x);let ev=RESEARCH_EVIDENCE[x.name];let photos=VERIFIED_PHOTOS[x.name]||[];let badge=cardComplete(x)?'완성 PM PASS':'설명 종합완료 · 사진 검수중';cover.innerHTML=`<div class="foodtitle"><div>${x.flag} ${x.name}<span class="pmstamp">${badge}</span><div class="sub">${x.country} · ${x.type}</div></div><button class="close" onclick="closeM()">×</button></div><div class="gallery" id="gallery"></div>`;body.innerHTML=`<div class="sec"><h2>어떤 음식인가</h2><p class="appeal">${a[0]}</p></div><div class="secgrid"><div class="secbox"><h2>재료와 조리</h2><p>${a[1]}</p></div><div class="secbox taste"><h2>맛 · 향 · 식감</h2><p>${a[2]}</p></div></div>${ev?`<div class="sec"><h2>PM 조사 메모</h2><p>${ev.synthesis}</p><p style="font-size:.86rem;color:#6b6474"><b>교차확인:</b> ${ev.sources.join(' · ')}</p></div>`:''}`;renderVerifiedPhotos(photos,x)}
function renderVerifiedPhotos(photos,x){let g=document.getElementById('gallery');if(!g)return;if(!photos.length){g.innerHTML=`<div class="loading">📷 ${esc(x.name)}<br><span style="font-size:.9rem;font-weight:700">실제 음식사진을 눈으로 확인하고 사용권까지 검수 중입니다.<br>자동검색 사진은 대신 표시하지 않습니다.</span></div>`;return}let main=photos[0];g.innerHTML=`<div class="heroPhoto"><img id="heroImg" src="${main.src}" alt="${esc(x.name)} 대표사진"></div><div class="thumbs">${photos.slice(1,4).map((p,i)=>`<button type="button" class="thumb" data-i="${i+1}"><img src="${p.src}" alt="${esc(x.name)} 다른 모습"></button>`).join('')}</div>`;g.querySelectorAll('.thumb').forEach(b=>b.addEventListener('click',()=>{let idx=+b.dataset.i;let h=document.getElementById('heroImg');let tmp=h.src;h.src=photos[idx].src;photos[idx].src=tmp;b.querySelector('img').src=photos[idx].src}))}
function closeM(){modal.classList.add('hidden');current=null}
function goHome(){listing.classList.add('hidden');home.classList.remove('hidden');q.value=''}
init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
