<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계 음식 카드</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ec;--ink:#1d2b24;--sub:#5b6b62;--card:#fff;--line:#dbe3da;--chip:#e5ece3;--acc:#c8501e}
@media (prefers-color-scheme:dark){:root{--bg:#121916;--ink:#eef3ee;--sub:#9fb0a6;--card:#1b2520;--line:#2c3a33;--chip:#26332c;--acc:#f0925c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.stage{flex:1;min-height:0;padding:14px 18px 6px;display:flex}
.card{flex:1;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr}
@media (orientation:portrait){.card{grid-template-columns:1fr;grid-template-rows:38% 1fr}}
.photo{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .emo{font-size:clamp(80px,16vmin,180px)}
.badge{position:absolute;left:18px;top:16px;background:rgba(255,255,255,.92);color:#1d2b24;border-radius:999px;padding:5px 14px;font-weight:700;font-size:clamp(13px,1.8vmin,18px);z-index:2}
.info{padding:clamp(14px,2.6vmin,30px);display:flex;flex-direction:column;gap:clamp(6px,1.4vmin,14px);min-height:0;overflow:hidden}
h1{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;font-size:clamp(28px,5vmin,52px);margin:0;line-height:1.1}
.intro{margin:0;color:var(--sub);font-size:clamp(13px,1.9vmin,19px)}
.cols{display:grid;grid-template-columns:1fr 1.4fr;gap:clamp(10px,2vmin,22px);min-height:0}
@media (orientation:portrait) and (max-width:700px){.cols{grid-template-columns:1fr}}
h2{font-size:clamp(12px,1.7vmin,16px);margin:0 0 6px;color:var(--acc)}
ul,ol{margin:0;padding-left:1.15em;font-size:clamp(12px,1.8vmin,17px)}
li{margin-bottom:3px}
.box{background:var(--chip);border-radius:14px;padding:clamp(8px,1.5vmin,14px) clamp(10px,1.8vmin,16px);font-size:clamp(12px,1.8vmin,17px)}
.box b{color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
@media (orientation:portrait) and (max-width:700px){.two{grid-template-columns:1fr}}
nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 18px 12px}
nav button{border:0;background:var(--ink);color:var(--bg);font:700 18px "Noto Sans KR",sans-serif;width:48px;height:48px;border-radius:50%;cursor:pointer}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:70vw}
.dots button{width:12px;height:12px;border-radius:50%;background:var(--line);padding:0}
.dots button[aria-current="true"]{background:var(--acc);transform:scale(1.35)}
button:focus-visible{outline:3px solid #e8913a;outline-offset:2px}
</style>
</head>
<body>
<div class="stage"><article class="card" id="card" aria-live="polite"></article></div>
<nav><button id="prev" aria-label="이전 음식">‹</button><div class="dots" id="dots"></div><button id="next" aria-label="다음 음식">›</button></nav>
<script>
/* 사진은 images 폴더에 넣어주세요. 파일이 없으면 이모지로 대신 표시됩니다. */
const D=[
{c:"한국",f:"🇰🇷",n:"비빔밥",img:"images/bibimbap.jpg",e:"🍚",bg:"#f6d9c4",
 intro:"밥 위에 갖은 나물과 고추장을 올려 쓱쓱 비벼 먹는 한국의 대표 한 그릇 요리.",
 ing:["밥 2공기","시금치·콩나물·당근·애호박","소고기 100g","달걀 2개","고추장 2큰술","참기름·깨"],
 st:["나물을 각각 살짝 데치거나 볶아 간을 해요.","소고기는 간장 양념해 볶아요.","그릇에 밥과 나물을 색깔별로 돌려 담아요.","달걀프라이와 고추장, 참기름을 올려 비벼요."],
 t:"고소하고 매콤하며 채소의 단맛이 어우러져요.",k:"다양한 색의 재료를 돌려 담는 모양새가 특징이에요."},
{c:"일본",f:"🇯🇵",n:"스시",img:"images/sushi.jpg",e:"🍣",bg:"#f8d0d3",
 intro:"식초로 간한 밥 위에 신선한 생선을 올린 한 입 크기의 요리.",
 ing:["초밥용 밥 2공기","쌀식초·설탕·소금","생선회(연어·참치 등)","와사비","간장","생강초절임"],
 st:["밥에 식초, 설탕, 소금을 섞어 식혀요.","생선을 얇고 비스듬히 썰어요.","밥을 한 입 크기로 쥐고 와사비를 살짝 발라요.","생선을 올려 모양을 잡아요."],
 t:"담백하고 깔끔하며 생선의 감칠맛이 살아 있어요.",k:"재료의 신선함과 밥의 온도, 쥐는 힘이 맛을 좌우해요."},
{c:"태국",f:"🇹🇭",n:"팟타이",img:"images/padthai.jpg",e:"🍜",bg:"#fcd9a6",
 intro:"쌀국수를 새우, 숙주, 땅콩과 볶아 새콤달콤하게 맛낸 길거리 음식.",
 ing:["쌀국수 150g","새우 6마리","숙주·부추","달걀 1개","피시소스·타마린드·설탕","다진 땅콩·라임"],
 st:["쌀국수를 미지근한 물에 불려요.","팬에 새우와 달걀을 먼저 볶아요.","면과 소스를 넣고 센 불에 볶아요.","숙주와 부추를 넣고 땅콩, 라임을 곁들여요."],
 t:"새콤달콤하고 짭짤하며 땅콩의 고소함이 더해져요.",k:"센 불에 빠르게 볶아 면이 쫄깃하게 남아야 해요."},
{c:"베트남",f:"🇻🇳",n:"쌀국수",img:"images/pho.jpg",e:"🍲",bg:"#cfe8c9",
 intro:"소뼈를 오래 우린 맑은 국물에 쌀면과 허브를 듬뿍 얹은 국수.",
 ing:["소뼈·양지","양파·생강(구워서)","팔각·계피·정향","쌀국수","숙주·고수·바질","라임·고추"],
 st:["뼈를 데쳐 핏물을 빼요.","구운 양파·생강, 향신료와 함께 몇 시간 끓여요.","면을 삶아 그릇에 담고 고기를 얹어요.","뜨거운 국물을 붓고 허브를 올려요."],
 t:"맑고 깊은 국물에 허브 향이 상큼하게 올라와요.",k:"국물을 오래 우려 깔끔하게 맑게 내는 것이 핵심이에요."},
{c:"인도",f:"🇮🇳",n:"버터 치킨 커리",img:"images/butterchicken.jpg",e:"🍛",bg:"#fbd2a0",
 intro:"요거트에 재운 닭고기를 토마토 버터 소스에 끓인 부드러운 커리.",
 ing:["닭다리살 500g","요거트","토마토 퓨레","버터·생크림","마늘·생강","가람 마살라"],
 st:["닭을 요거트와 향신료에 재워요.","재운 닭을 구워 겉면에 색을 내요.","버터에 마늘·생강, 토마토를 끓여 소스를 만들어요.","닭과 생크림을 넣어 졸이고 난과 함께 내요."],
 t:"진하고 부드러우며 은은하게 달콤해요.",k:"향신료는 강하지만 크림 덕분에 순한 맛이 나요."},
{c:"이탈리아",f:"🇮🇹",n:"나폴리 피자",img:"images/pizza.jpg",e:"🍕",bg:"#f9cfc8",
 intro:"얇고 쫄깃한 도우에 토마토, 모짜렐라, 바질을 올려 구운 정통 피자.",
 ing:["강력분 300g","이스트·소금·물","토마토 소스","모짜렐라 치즈","바질","올리브오일"],
 st:["반죽을 치대 8시간 이상 발효해요.","둥글고 얇게 펴 소스를 발라요.","치즈를 올리고 가장 뜨거운 오븐에 구워요.","바질과 올리브오일을 뿌려요."],
 t:"쫄깃한 도우와 새콤한 토마토, 고소한 치즈의 조화예요.",k:"가장자리가 부풀고 살짝 그을린 모양이 특징이에요."},
{c:"스페인",f:"🇪🇸",n:"파에야",img:"images/paella.jpg",e:"🥘",bg:"#fbe3a3",
 intro:"사프란으로 노랗게 물든 밥에 해산물을 얹어 팬째 내는 요리.",
 ing:["밥용 쌀 2컵","새우·홍합·오징어","사프란","토마토·피망·마늘","해산물 육수","올리브오일"],
 st:["팬에 마늘, 토마토, 피망을 볶아요.","쌀을 넣고 사프란 육수를 부어요.","해산물을 올리고 젓지 않고 끓여요.","바닥에 누룽지가 생기면 불을 끄고 뜸 들여요."],
 t:"해산물의 감칠맛과 사프란의 은은한 향이 나요.",k:"바닥의 누룽지(소카라트)가 별미예요."},
{c:"멕시코",f:"🇲🇽",n:"타코",img:"images/taco.jpg",e:"🌮",bg:"#f9d79e",
 intro:"또르띠야에 고기와 살사, 라임을 올려 손으로 접어 먹는 요리.",
 ing:["옥수수 또르띠야","소고기 또는 돼지고기","양파·고수","토마토 살사","라임","아보카도"],
 st:["고기를 양념해 구운 뒤 잘게 썰어요.","또르띠야를 팬에 따뜻하게 데워요.","고기와 양파, 고수를 올려요.","살사와 라임즙을 뿌려 접어요."],
 t:"상큼하고 매콤하며 옥수수 향이 고소해요.",k:"재료를 취향대로 올려 직접 만들어 먹어요."},
{c:"페루",f:"🇵🇪",n:"세비체",img:"images/ceviche.jpg",e:"🦐",bg:"#cdebe5",
 intro:"라임즙에 살짝 절인 생선과 양파, 고수를 차갑게 낸 해산물 요리.",
 ing:["흰살생선 300g","라임즙 6개분","붉은 양파","고수·고추","소금","고구마·옥수수"],
 st:["생선을 한 입 크기로 썰어 소금 간을 해요.","라임즙과 고추를 넣고 버무려요.","양파와 고수를 넣고 5~10분 두어요.","차갑게 고구마, 옥수수와 함께 내요."],
 t:"새콤하고 시원하며 산뜻해요.",k:"불 없이 라임의 산으로 생선을 익혀요."},
{c:"영국",f:"🇬🇧",n:"피시 앤 칩스",img:"images/fishandchips.jpg",e:"🐟",bg:"#d6e4ee",
 intro:"바삭하게 튀긴 흰살생선에 두툼한 감자튀김을 곁들인 대표 음식.",
 ing:["대구 등 흰살생선","밀가루·맥주","감자 3개","소금","식용유","식초·타르타르소스"],
 st:["감자를 굵게 썰어 한 번 튀겨요.","생선에 밀가루를 묻히고 맥주 반죽을 입혀요.","180도 기름에 바삭하게 튀겨요.","감자를 다시 튀겨 소금과 식초를 뿌려요."],
 t:"겉은 바삭하고 속은 촉촉하며 식초로 상큼함을 더해요.",k:"맥주 반죽이 가볍고 바삭한 튀김옷을 만들어요."}
];
let i=0;const card=document.getElementById("card"),dots=document.getElementById("dots");
function show(){
 const d=D[i];
 card.innerHTML=`<div class="photo" style="background:${d.bg}"><span class="badge">${d.f} ${d.c}</span><span class="emo" aria-hidden="true">${d.e}</span><img src="${d.img}" alt="${d.n}" onerror="this.remove()"></div>
 <div class="info"><h1>${d.n}</h1><p class="intro">${d.intro}</p>
 <div class="cols"><div><h2>재료</h2><ul>${d.ing.map(x=>`<li>${x}</li>`).join("")}</ul></div>
 <div><h2>조리법</h2><ol>${d.st.map(x=>`<li>${x}</li>`).join("")}</ol></div></div>
 <div class="two"><div class="box"><b>맛</b><br>${d.t}</div><div class="box"><b>특징</b><br>${d.k}</div></div></div>`;
 [...dots.children].forEach((b,j)=>b.setAttribute("aria-current",j===i));
}
function go(n){i=(n+D.length)%D.length;show();}
D.forEach((d,j)=>{const b=document.createElement("button");b.setAttribute("aria-label",d.c+" "+d.n);b.onclick=()=>go(j);dots.appendChild(b);});
document.getElementById("prev").onclick=()=>go(i-1);
document.getElementById("next").onclick=()=>go(i+1);
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(i-1);if(e.key==="ArrowRight")go(i+1);});
let x0=null;
card.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
card.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(i+(dx<0?1:-1));x0=null;});
show();
</script>
</body>
</html>
